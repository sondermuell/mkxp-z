name: Windows Only

on:
  workflow_dispatch:

jobs:
  build-windows-msys2:
    name: Windows MSYS2
    runs-on: windows-latest
    steps:
      - uses: benjlevesque/short-sha@v4.0
        id: short-sha
        with:
          length: 7

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            bison mingw-w64-x86_64-ccache mingw-w64-x86_64-cmake diffutils mingw-w64-x86_64-git make mingw-w64-x86_64-meson mingw-w64-x86_64-ruby
            mingw-w64-x86_64-gcc

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore from cache
        if: false
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: windows-msys2-x86_64-
          restore-keys: windows-msys2-x86_64-

      - name: Set up ccache
        shell: msys2 {0}
        run: |
          ccache --set-config=cache_dir="$(pwd)/ccache"
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=1280MiB
          ccache --zero-stats

      - name: Configure
        shell: msys2 {0}
        run: |
          meson setup --prefix "$(pwd)/build/artifact" --buildtype release -Dstrip=true -Db_lto=true build

      - name: Build
        id: build
        shell: msys2 {0}
        run: |
          exit_code=0
          CLICOLOR_FORCE=1 ninja -C build -v || exit_code=$?
          echo exit-code=$exit_code >> "$GITHUB_OUTPUT"
          date -u +time=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"

      - name: Save to cache
        if: false
        uses: actions/cache/save@v6
        with:
          path: ccache
          key: windows-msys2-x86_64-${{ github.sha }}-${{ steps.build.outputs.time }}

      - name: Show ccache statistics
        shell: msys2 {0}
        run: |
          ccache --show-stats --verbose

      - name: Check build status
        shell: msys2 {0}
        run: |
          exit ${{ steps.build.outputs.exit-code }}

      - name: Prepare artifact
        shell: msys2 {0}
        run: |
          meson install -C build --no-rebuild --tags mkxp-z

      - name: Check for DLLs missing from the artifact
        shell: msys2 {0}
        run: |
          cd build/artifact
          error_flag=

          for file in *.exe
          do
            ldd_output="$(ldd "$file")"
            echo "$file"
            echo "$ldd_output"

            while IFS= read -r line
            do
              dll_name="$(echo "$line" | sed -e 's/=>/|/g' | cut -d '|' -f 1 | sed -e 's/^[ \t]*//g' -e 's/[ \t]*$//g')"
              dll_location="$(echo "$line" | sed -e 's/=>/|/g' | cut -d '|' -f 2 | sed -e 's/^[ \t]*//g' -e 's/[ \t]*$//g')"
              if [[ "$dll_location" = 'not found'* ]] || [[ "$dll_location" = '/mingw64/bin/'* ]] || [[ "$dll_location" = '/mingw64/lib/'* ]] || [[ "$dll_location" = '/mingw64/usr/bin/'* ]] || [[ "$dll_location" = '/mingw64/usr/lib/'* ]]
              then
                error_flag=1
                echo "::error::$dll_name is missing from the artifact"
              fi
            done <<< "$ldd_output"
          done

          if [ -n "$error_flag" ]
          then
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mkxp-z.windows.msys2.x86_64.${{github.event_name == 'pull_request' && format('PR{0}', github.event.number) || github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact
